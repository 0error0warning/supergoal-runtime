name: CI

on:
  push:
  pull_request:

jobs:
  plugin-package-and-storage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout supergoal-runtime
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff build

      - name: Lint
        run: python -m ruff check supergoal_runtime scripts tests

      - name: Run host-independent tests
        run: |
          python -m pytest \
            tests/unit \
            tests/integration \
            tests/replay \
            tests/contract \
            -q -o 'addopts='

      - name: Compile plugin
        run: python -m compileall -q supergoal_runtime scripts tests

      - name: Build wheel
        run: python -m build --wheel

  latest-hermes-main-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout supergoal-runtime
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout latest Hermes main
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes
          fetch-depth: 0

      - name: Apply generic plugin ABI from upstream PR 63208
        working-directory: hermes
        run: |
          git config user.name 'supergoal-runtime-ci'
          git config user.email 'ci@invalid.local'
          git fetch https://github.com/0error0warning/hermes-agent.git \
            feature/supergoal-plugin-abi-upstream
          git cherry-pick 8efcb2a68 01dfdc3b3 6fe5c9346

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes, plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./hermes
          python -m pip install -e ./plugin pytest ruff

      - name: Run full standalone plugin suite against latest Hermes main
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin:${{ github.workspace }}/hermes
        working-directory: plugin
        run: |
          python -m pytest tests -q -o 'addopts='
          python -m ruff check supergoal_runtime scripts tests
          python -m compileall -q supergoal_runtime scripts tests
