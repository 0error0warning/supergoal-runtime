name: CI

on:
  push:
  pull_request:

jobs:
  plugin-package-and-storage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout supergoal-runtime
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff build

      - name: Lint
        run: python -m ruff check supergoal_runtime scripts tests

      - name: Run independent storage and migration tests
        run: |
          python -m pytest \
            tests/unit \
            tests/integration \
            -q -o 'addopts='

      - name: Compile plugin
        run: python -m compileall -q supergoal_runtime scripts tests

      - name: Build wheel
        run: python -m build --wheel
